name: ci
on: [push, pull_request]

# Job logs need admin rights to download, but annotations are readable by anyone on a public
# repo. Steps that can fail in an interesting way therefore echo their tail as an annotation:
# a red tick whose reason you cannot read is barely better than no CI.
#
# Defects already found by running these steps rather than reading them: `npm run test`
# against a package.json with no `test` script, `eslint web` from a directory with no config,
# a fabricated node base-image digest, a missing .dockerignore, nginx exiting 1 under
# cap_drop ALL, a worker inheriting an HTTP healthcheck it cannot answer, and a pyproject
# with no [build-system] that could not be pip-installed at all.
# See docs/final-audit.md for what is verified and what is not.

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff black mypy types-PyYAML pydantic pyyaml numpy scipy
      - run: ruff check orbit tests experiments api
      - run: black --check orbit tests experiments api
      # mypy is strict on orbit/, which includes the Pydantic-typed topology loader.
      - run: mypy

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: orbit, POSTGRES_PASSWORD: orbitpw, POSTGRES_DB: orbit }
        ports: ["55432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: >-
          pip install -e ".[dev,spec,lp]" fastapi "uvicorn[standard]" sqlalchemy alembic
          "psycopg[binary]" argon2-cffi pydantic-settings prometheus-client email-validator
          httpx pandas pyarrow matplotlib networkx pytest-cov
      - name: pytest
        run: |
          set -o pipefail
          pytest --cov=orbit/engine --cov=orbit/algorithms --cov-fail-under=80 2>&1 | tee /tmp/pytest.log
        env:
          DATABASE_URL: postgresql+psycopg://orbit:orbitpw@127.0.0.1:55432/orbit
          SESSION_SECRET: ci-secret-value-at-least-32-bytes-long!!
      - name: report failure
        if: failure()
        run: python .github/annotate.py pytest /tmp/pytest.log

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
        env: { PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1" }
      - run: npm run typecheck
      - run: npx eslint .
      - run: npm run test
      # `npm run build` runs `tsc -b`, a different code path from `tsc --noEmit`, and was
      # previously exercised only inside the e2e job's web server. A build break should fail
      # here, where the cause is obvious, rather than there as a server that never came up.
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Playwright builds and serves the bundle itself (see web/playwright.config.ts), and the
      # axe scan runs in the same suite, so a WCAG regression fails the build.
      - name: playwright
        run: |
          set -o pipefail
          npm run e2e 2>&1 | tee /tmp/e2e.log
        env: { CI: "true" }
      - name: report failure
        if: failure()
        run: python ../.github/annotate.py playwright /tmp/e2e.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7
          if-no-files-found: ignore

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Both images build and `docker compose up` serves on a wiped volume, verified locally
      # on Docker Desktop. This job is what checks the same holds on a Linux runner.
      - run: docker build -f deploy/Dockerfile.api -t orbit-api:ci .
      - run: docker build -f deploy/Dockerfile.web -t orbit-web:ci .
      - name: the api image starts and answers /healthz
        run: |
          docker run -d --name orbit-api-ci -p 8000:8000 \
            -e SESSION_SECRET=ci-secret-value-at-least-32-bytes-long!! \
            -e DATABASE_URL=postgresql+psycopg://orbit:orbitpw@127.0.0.1:5432/orbit \
            orbit-api:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz; then exit 0; fi
            sleep 2
          done
          docker logs orbit-api-ci
          exit 1

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # gitleaks scans history, so a shallow clone would silently scan almost nothing.
        with: { fetch-depth: 0 }
      # The upstream action wants a licence key for some account types and fails closed
      # without one. The scanner is free, so this runs the same image and the same command
      # that was run locally against the full history, and fails the job on a hit.
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source=/repo --no-banner --redact --exit-code 1
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pip-audit bandit
      - run: bandit -r orbit api -ll
      # Advisory only: a new CVE in a transitive dependency should surface, not block a
      # research artifact's build. Read the log rather than trusting the tick.
      - run: pip-audit || true
