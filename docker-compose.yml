services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orbit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orbit-local-dev}
      POSTGRES_DB: orbit
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbit"]
      interval: 5s
      retries: 10

  api:
    build: { context: ., dockerfile: deploy/Dockerfile.api }
    environment:
      DATABASE_URL: postgresql+psycopg://orbit:${POSTGRES_PASSWORD:-orbit-local-dev}@postgres:5432/orbit
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set}
      ENV: production
    depends_on: { postgres: { condition: service_healthy } }
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    cpus: 1.0
    command: sh -c "alembic upgrade head && uvicorn api.main:app --host 0.0.0.0 --port 8000"

  worker:
    build: { context: ., dockerfile: deploy/Dockerfile.api }
    environment:
      DATABASE_URL: postgresql+psycopg://orbit:${POSTGRES_PASSWORD:-orbit-local-dev}@postgres:5432/orbit
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set}
    depends_on: { postgres: { condition: service_healthy } }
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    cpus: 2.0
    command: python -m api.worker
    # The worker shares the API's Dockerfile and so inherits its HEALTHCHECK, which curls
    # /healthz. The worker serves no HTTP, so that check can never pass and the container
    # reports unhealthy forever. It has no endpoint to probe; "the process is running" is
    # what Docker's own status already tells us.
    healthcheck: { disable: true }

  web:
    build: { context: ., dockerfile: deploy/Dockerfile.web }
    ports: ["8080:80"]
    depends_on: [api]
    # nginx starts as root, chowns its cache directories, then drops to uid 101. With
    # cap_drop ALL alone that chown fails and the container exits 1 before serving
    # anything. These four are what the startup sequence actually needs; everything else
    # stays dropped.
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]

volumes:
  pgdata:
