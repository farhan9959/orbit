[project]
name = "orbit"
version = "0.0.1"
description = "Flow-level network resilience simulator and evaluation harness"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

# The engine has no runtime dependencies. docs/02-architecture.md §2 lists NumPy for the
# allocator; it is deliberately not added yet, because the allocator is pure Python until
# a profile of a real benchmark cell says otherwise (architecture §8, mitigation 3).
#
# Two modules opt out and say so in their own docstrings: `orbit.optimal` needs NumPy and
# SciPy for the LP bound, and `orbit.topospec` needs PyYAML and Pydantic for the spec loader.
# Neither is imported by the engine, so `import orbit` still pulls in nothing.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "black>=24.8",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]
spec = ["pyyaml>=6.0", "pydantic>=2.7"]
lp = ["numpy>=1.26", "scipy>=1.11"]

[tool.pytest.ini_options]
# Keeps the repository root importable without an editable install, so `pytest` works from
# a clean checkout with nothing but the dev extras present.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# B008 forbids function calls in argument defaults. FastAPI's dependency injection is
# expressed exactly that way (`Depends(...)`), so the rule is wrong for these modules
# rather than the code being wrong.
"api/**" = ["B008"]
"tests/api/**" = ["B008"]

[tool.mypy]
python_version = "3.12"
files = ["orbit"]
strict = true

# CLAUDE.md scopes strict typing to orbit/. The experiment harness is followed only because
# orbit/cli.py imports it, and its numeric dependencies ship no stubs.
[[tool.mypy.overrides]]
module = ["experiments.*", "api.*"]
disallow_untyped_defs = false
disallow_any_generics = false

[[tool.mypy.overrides]]
module = ["pandas.*", "scipy.*", "matplotlib.*", "networkx.*", "pyarrow.*", "argon2.*"]
ignore_missing_imports = true
